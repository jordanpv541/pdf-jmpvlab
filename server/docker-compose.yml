# Servidor de conversiones de PDF jmpvlab.
#   caddy     → recibe las visitas en 80/443 y saca el certificado HTTPS solo
#   api       → nuestra API (FastAPI)
#   gotenberg → LibreOffice y Chromium; no se publica a internet
#
# Los tres contenedores corren sin permisos especiales (cap_drop: ALL), con el disco
# en solo lectura y con tope de procesos y de memoria.
name: pdf-jmpvlab

# Registro de cada contenedor: como máximo 3 archivos de 10 MB (no llena el disco).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # para escuchar en los puertos 80 y 443
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    networks:
      - front

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      GOTENBERG_URL: http://gotenberg:3000
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 3g
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      gotenberg:
        condition: service_healthy
    networks:
      - front
      - back

  gotenberg:
    # Versión fija: estas opciones de seguridad existen desde la 8.32 (lee el README para actualizarla).
    image: gotenberg/gotenberg:8.37.0
    restart: unless-stopped
    command:
      - gotenberg
      # Menos que JOB_TIMEOUT (180 s) de la API: así Gotenberg se rinde primero y la API avisa bien.
      - --api-timeout=170s
      - --api-body-limit=100MB
      - --log-level=warn
      # Lo que no usamos, apagado.
      - --webhook-disable=true
      - --api-disable-download-from=true
      # Chromium y LibreOffice no pueden abrir direcciones internas (red de Docker, Oracle, 169.254.169.254…).
      # Gotenberg resuelve cada dirección una sola vez y se conecta a esa IP (no se le puede engañar con el DNS).
      - --chromium-deny-private-ips=true
      - --libreoffice-deny-private-ips=true
      # Lista extra de direcciones prohibidas. En file:// solo se permite el archivo HTML de la propia
      # conversión (/tmp/<carpeta de Gotenberg>/<carpeta de la conversión>/...): no se puede listar /tmp
      # ni ver los archivos de otras personas. (Sin comas: Gotenberg separa la lista por comas.)
      - --chromium-deny-list=^file:(?!///tmp/[^/]+/[^/]+/[^/]).*|^https?://(localhost|[^/]*\.localhost|[^/]*\.internal|127\.|10\.|0\.|169\.254\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.|\[)
      # Cada conversión empieza sin galletas, caché ni datos guardados de la anterior.
      - --chromium-clear-cookies=true
      - --chromium-clear-storage=true
      - --chromium-clear-cache=true
      - --libreoffice-restart-after=20
      - --chromium-restart-after=50
    read_only: true
    tmpfs:
      # Gotenberg guarda aquí los archivos de cada conversión y los perfiles de Chromium y LibreOffice.
      - /tmp:size=2g,exec
      - /home/gotenberg:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 2048
    mem_limit: 4g
    logging: *logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      back:
        ipv4_address: 172.31.251.10
      egress:
        # IP fija: el firewall le prohíbe abrir conexiones a redes internas.
        ipv4_address: 172.31.250.10

networks:
  front: {}
  back:
    # Red solo entre la API y Gotenberg, sin salida a internet.
    internal: true
    ipam:
      config:
        - subnet: 172.31.251.0/24
  egress:
    # Salida a internet de Gotenberg (para HTML a PDF desde una dirección web).
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  caddy_data: {}
  caddy_config: {}
