# Sitio: que se genere sin cambios pendientes.
name: Sitio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node tools/build.mjs
